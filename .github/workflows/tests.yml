name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python 3.10
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            autocover_tool/requirements.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flask>=3.0,<4.0" "requests>=2.31,<3.0" "Pillow>=10.0,<13.0" python-docx

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Run unified test suite
        shell: pwsh
        run: python -B -m unittest discover -q

      - name: Compile Python sources
        shell: pwsh
        run: python -B -m compileall -q .

      - name: Check AutoCover JavaScript
        shell: pwsh
        run: node --check autocover_tool/static/app.js
