name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows full hermetic / Python 3.10
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            autocover_tool/requirements.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flask>=3.0,<4.0" "requests>=2.31,<3.0" "Pillow>=10.0,<13.0" python-docx

      - name: Validate editable package metadata
        shell: pwsh
        run: |
          python -m pip install --no-deps --editable .
          python -B scripts/smoke_packaging.py
          autoslice --help

      - name: Validate wheel outside repository
        shell: pwsh
        run: python -B scripts/verify_distribution.py

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib" -Filter ffmpeg.exe -Recurse |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "FFmpeg installation completed but ffmpeg.exe was not found"
          }
          $ffmpeg.DirectoryName | Add-Content -Path $env:GITHUB_PATH
          & $ffmpeg.FullName -version

      - name: Run architecture and external boundary guards
        shell: pwsh
        run: >-
          python -B -m unittest
          tests.architecture.test_architecture_contracts
          tests.architecture.test_external_boundaries
          -q

      - name: Run unified test suite
        shell: pwsh
        run: python -B scripts/run_hermetic_tests.py -q

      - name: Compile Python sources
        shell: pwsh
        run: python -B -m compileall -q .

      - name: Check AutoCover JavaScript
        shell: pwsh
        run: node --check src/autoslice_cover/resources/static/app.js

  linux-logic-only:
    name: Linux logic only (no media support) / Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install minimal logic-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flask>=3.0,<4.0" "requests>=2.31,<3.0" "Pillow>=10.0,<13.0"

      - name: Validate editable package metadata
        run: |
          python -m pip install --no-deps --editable .
          python -B scripts/smoke_packaging.py
          autoslice --help

      - name: Run Linux logic-only suite (not full media support)
        run: python -B scripts/run_linux_logic_tests.py -q
