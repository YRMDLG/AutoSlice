<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>字幕校对与压制 · AutoSlice</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ url_for('static', filename='workbench.css') }}">
<style>
body{overflow:hidden}
.subtitle-layout{height:calc(100vh - var(--topbar-height));min-height:690px;display:grid;grid-template-columns:minmax(270px,310px) minmax(650px,1fr) minmax(330px,370px);overflow-x:auto;overflow-y:hidden}
.subtitle-panel{min-width:0;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.subtitle-panel:last-child{border-right:0}
.subtitle-panel-head{min-height:64px;padding:13px 14px;border-bottom:1px solid var(--line)}
.subtitle-panel-head h1{margin:0;font-size:22px;line-height:1.2}
.subtitle-panel-head h2{margin:0;font-size:16px;line-height:1.3}
.subtitle-panel-head .sub{margin-top:5px;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.queue-head-row .queue-count{color:var(--muted);font-size:11px;white-space:nowrap}
.queue-tools{display:grid;gap:8px;margin-top:11px}
.queue-sort{padding:7px 9px;font-size:13px}
.directory-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
.queue{overflow:auto;flex:1;background:var(--surface-input)}
.queue-empty{padding:26px 16px;color:var(--muted);font-size:13px;text-align:center}
.queue-item{width:100%;padding:12px 13px;display:block;border:0;border-bottom:1px solid #262b28;background:transparent;color:var(--text);text-align:left;cursor:pointer}
.queue-item:hover{background:var(--surface-hover)}
.queue-item.active{padding-left:10px;background:#1d3029;box-shadow:inset 3px 0 var(--accent)}
.queue-title{font-size:13px;font-weight:680;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.queue-meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.queue-meta .badge.ok{border-color:#37694f;color:#8ee0b3}
.queue-meta .badge.warn{border-color:#6e5a32;color:#f2d89e}
.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.editor-actions{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.title-reference{padding:10px 13px;border-bottom:1px solid var(--line);background:#111713}
.title-reference-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title-reference-label{color:var(--muted);font-size:11px;font-weight:750}
.title-reference-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.title-recommended{margin-top:6px;color:var(--text);font-size:15px;font-weight:750;line-height:1.45;overflow-wrap:anywhere}
.title-recommended.empty{color:var(--muted);font-size:13px;font-weight:500}
.title-candidates{display:grid;gap:5px;margin-top:8px}
.title-candidate{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px;align-items:start;color:var(--text-secondary);font-size:12px;line-height:1.45}
.title-candidate strong{color:#89d9ad;font-variant-numeric:tabular-nums}
.title-reason{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.45;overflow-wrap:anywhere}
.filterbar{min-height:46px;padding:8px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#141715}
.segments{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.segments button{min-height:29px;padding:5px 11px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.segments button:last-child{border-right:0}
.segments button:hover{color:var(--text);background:var(--surface-hover)}
.segments button.active{background:var(--surface-raised);color:var(--text)}
.change-count{color:var(--muted);font-size:13px}
.task-status{min-height:38px;padding:9px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:var(--info-bg);color:#b7d9ed;font-size:13px;overflow-wrap:anywhere}
.task-status::before{content:"";width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--info)}
.task-status.error{background:var(--danger-bg);color:#ffc1bd}.task-status.error::before{background:var(--danger)}
.task-status.done{background:var(--success-bg);color:#b9ebce}.task-status.done::before{background:var(--success)}
.cue-list{overflow:auto;flex:1;padding-bottom:66px;background:#111412}
.cue-row{display:grid;grid-template-columns:24px 94px minmax(0,1fr);gap:10px;padding:11px 13px;border-bottom:1px solid #262b28;align-items:start;cursor:pointer}
.cue-row:hover{background:#151916}
.cue-row.selected{background:#19231e;box-shadow:inset 3px 0 #4da77c}
.cue-row.changed{background:#1b2a24}
.cue-row.suggested{box-shadow:inset 3px 0 var(--accent)}
.cue-row.deleted{background:#281d1d}
.cue-check{width:16px;height:16px;margin-top:24px;accent-color:var(--accent)}
.cue-spacer{display:block;width:16px}
.cue-detail{grid-column:2/-1;margin-top:2px;padding:9px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border:1px solid #35453d;border-radius:5px;background:#111713;cursor:default}
.cue-time-editor{display:grid;grid-template-columns:154px 154px auto;gap:8px;align-items:end}
.cue-time-field{display:grid;gap:4px;color:var(--muted);font-size:10px;font-weight:700}.cue-time-input{min-width:0;padding:6px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.cue-time-error{grid-column:1/-1;color:#ffaaa4;font-size:11px}
.cue-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.cue-action,.cue-delete{width:auto;min-height:28px;padding:4px 9px;border:1px solid #48544d;border-radius:4px;background:#17201b;color:#cde2d4;cursor:pointer;font-size:11px;white-space:nowrap}.cue-action:hover{border-color:#76b68f;background:#21382a;color:#fff}.cue-action.unmerge{border-color:#806a3c;background:#2a2517;color:#f0d99b}.cue-action.unmerge:hover{border-color:#c4a64f;background:#3b341c;color:#fff}
.cue-delete{margin-top:0;border-color:#6b4343;background:#211819;color:#f0b7b7}
.cue-delete:hover{border-color:#a85b5b;background:#362020;color:#fff}
.cue-delete.restore{border-color:#37694f;background:#17251d;color:#8ee0b3}
.cue-delete.restore:hover{border-color:#5baf7f;background:#203a2b;color:#fff}
.cue-time{padding-top:21px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;line-height:1.55}
.cue-content{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cue-column{min-width:0}
.cue-label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:750}
.cue-original{min-height:44px;padding:7px 9px;border:1px solid transparent;color:#aeb8b2;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.cue-edit{min-height:44px;padding:7px 9px;overflow:hidden;resize:vertical;font-size:13px;line-height:1.5}
.cue-reason{margin-top:5px;color:#93dec0;font-size:11px;overflow-wrap:anywhere}
.cue-reason .confidence{margin-left:7px;color:var(--warning)}
.editor-panel{position:relative}
.editor-footer{position:absolute;left:0;right:0;bottom:0;min-height:58px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);background:rgba(20,23,21,.98)}
.artifact{min-width:0;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.settings-head{padding-bottom:0}
.settings-tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:11px;border:1px solid var(--line);border-radius:5px 5px 0 0;overflow:hidden}
.settings-tabs button{padding:7px 8px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700}
.settings-tabs button:last-child{border-right:0}
.settings-tabs button.active{background:var(--surface-raised);color:var(--text)}
.right-scroll{overflow:auto;flex:1;padding:13px}
.settings-view[hidden]{display:none}
.preview{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:#080a09}
.preview img{width:100%;height:100%;object-fit:contain;display:none}
.preview-placeholder{color:var(--muted);font-size:13px}
.preview-controls{display:grid;grid-template-columns:1fr 70px auto;gap:7px;align-items:center;margin-top:8px}
input[type=range]{min-width:0;accent-color:var(--accent)}
.section{padding:15px 0;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section-title{margin-bottom:10px;color:var(--text);font-size:13px;font-weight:750}
.field{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px;align-items:center;margin-bottom:9px}
.field:last-child{margin-bottom:0}.field label{color:var(--text-secondary);font-size:13px}
.readonly{padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface-input);color:var(--text);font-size:13px;overflow-wrap:anywhere}
.color-field{display:grid;grid-template-columns:1fr 38px;gap:6px}
input[type=color]{width:38px;height:36px;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--surface-input)}
.font-status{margin-top:7px;color:var(--muted);font-size:11px}.font-status.ok{color:var(--success)}
.settings-actions{padding:11px 13px;border-top:1px solid var(--line);background:#141715}
.settings-actions .button{width:100%}
@media(max-width:1220px){.subtitle-layout{grid-template-columns:240px minmax(560px,1fr) 310px}}
</style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="AutoSlice 首页">
        <span class="brand-mark" aria-hidden="true">AS</span>
        <span class="brand-copy"><strong>AutoSlice</strong><span>直播切片工作台</span></span>
    </a>
    <nav class="topnav" aria-label="主要功能">
        <a href="/">智能分析</a>
        {% if legacy_direct_slice_enabled %}<a href="/direct-slice">高级重切</a>{% endif %}
        <a href="/subtitle-workflow" class="active" aria-current="page">字幕校对</a>
        <a href="/autocover" target="_blank" rel="noopener">自动封面</a>
    </nav>
</header>
<main class="subtitle-layout">
    <section class="subtitle-panel queue-panel">
        <div class="subtitle-panel-head">
            <div class="queue-head-row">
                <h1>投稿队列</h1>
                <span class="queue-count" id="queueCount">0 组投稿</span>
            </div>
            <div class="queue-tools">
                <select id="queueSort" class="queue-sort" aria-label="投稿队列排序">
                    <option value="folder_created_desc">文件夹：最新创建</option>
                    <option value="folder_created_asc">文件夹：最早创建</option>
                    <option value="folder_modified_desc">文件夹：最近修改</option>
                    <option value="source_modified_desc">视频：最近修改</option>
                    <option value="name_asc">名称：升序</option>
                    <option value="name_desc">名称：降序</option>
                </select>
                <div class="directory-row">
                    <input id="rootDir" type="text" aria-label="投稿目录" autocomplete="off" placeholder="投稿目录">
                    <button class="button" id="scanButton" type="button">扫描</button>
                </div>
            </div>
        </div>
        <div id="queue" class="queue"><div class="queue-empty">等待扫描</div></div>
    </section>

    <section class="subtitle-panel editor-panel">
        <div class="subtitle-panel-head editor-head">
            <div style="min-width:0">
                <h2 id="editorTitle">请选择投稿</h2>
                <div id="editorPath" class="sub"></div>
            </div>
            <div class="editor-actions">
                <button class="button primary" type="button" id="transcribeButton" disabled>自动识别字幕</button>
                <button class="button" type="button" id="reflowButton" disabled>整理长字幕</button>
                <button class="button" type="button" id="reviewButton" disabled>AI 检查</button>
                <button class="button quiet" type="button" id="forceReviewButton" title="忽略已有缓存并重新调用 AI" disabled>强制重新检查</button>
            </div>
        </div>
        <div class="title-reference" aria-live="polite">
            <div class="title-reference-head">
                <span class="title-reference-label">参考标题</span>
                <div class="title-reference-actions">
                    <button class="button" type="button" id="generateTitleButton" disabled>生成参考标题</button>
                    <button class="button quiet" type="button" id="copyTitleButton" disabled>复制推荐标题</button>
                </div>
            </div>
            <div id="recommendedTitle" class="title-recommended empty">尚未生成</div>
            <div id="titleCandidates" class="title-candidates" hidden></div>
            <div id="titleReason" class="title-reason" hidden></div>
        </div>
        <div class="filterbar">
            <div class="segments" id="cueFilters">
                <button type="button" data-filter="suggested">建议</button>
                <button type="button" data-filter="all" class="active">全部</button>
                <button type="button" data-filter="changed">已改</button>
            </div>
            <div id="changeCount" class="change-count">0 条修改</div>
        </div>
        <div id="taskStatus" class="task-status" role="status" aria-live="polite">等待选择投稿</div>
        <div id="cueList" class="cue-list"><div class="queue-empty">选择左侧投稿后加载字幕</div></div>
        <div class="editor-footer">
            <div id="artifactPath" class="artifact">尚未生成校对字幕</div>
            <button class="button primary" id="saveButton" type="button" disabled>保存校对字幕</button>
        </div>
    </section>

    <aside class="subtitle-panel settings-panel" id="settingsPanel">
        <div class="subtitle-panel-head settings-head">
            <h2>字幕样式与导出</h2>
            <div id="fontStatus" class="font-status">检查字体中...</div>
            <div class="settings-tabs" role="tablist" aria-label="字幕设置">
                <button type="button" class="active" data-settings-tab="style" role="tab" aria-selected="true">样式预览</button>
                <button type="button" data-settings-tab="export" role="tab" aria-selected="false">导出参数</button>
            </div>
        </div>
        <div class="right-scroll">
            <div class="settings-view" data-settings-view="style">
                <div class="preview" id="previewBox">
                    <img id="previewImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="字幕样式预览">
                    <div id="previewPlaceholder" class="preview-placeholder">选择投稿后生成预览</div>
                </div>
                <div class="preview-controls">
                    <input id="previewRange" type="range" min="0" max="1" step="0.1" value="0" aria-label="预览时间">
                    <input id="previewTime" type="number" min="0" step="0.1" value="0" aria-label="预览秒数">
                    <button class="button" id="previewButton" type="button" disabled>更新预览</button>
                </div>
                <div class="section">
                    <div class="section-title">字幕样式</div>
                    <div class="field"><label>字体</label><div class="readonly" id="fontName">Noto Sans S Chinese Black</div></div>
                    <div class="field"><label for="fontSize">剪映字号</label><input id="fontSize" type="number" min="1" max="30" step="0.1" value="20"></div>
                    <div class="field"><label for="fontColor">字体颜色</label><div class="color-field"><input id="fontColor" type="text" value="ffffff"><input id="fontColorPicker" type="color" value="#ffffff" aria-label="字体颜色选择"></div></div>
                    <div class="field"><label for="outlineColor">描边颜色</label><div class="color-field"><input id="outlineColor" type="text" value="d06e95"><input id="outlineColorPicker" type="color" value="#d06e95" aria-label="描边颜色选择"></div></div>
                    <div class="field"><label for="outlineWidth">描边粗细</label><input id="outlineWidth" type="number" min="0" max="100" step="1" value="100"></div>
                    <div class="field"><label for="positionX">位置 X</label><input id="positionX" type="number" min="-1000" max="1000" step="1" value="0"></div>
                    <div class="field"><label for="positionY">位置 Y</label><input id="positionY" type="number" min="-1000" max="1000" step="1" value="-788"></div>
                </div>
            </div>
            <div class="settings-view" data-settings-view="export" hidden>
                <div class="section">
                    <div class="section-title">视频导出</div>
                    <div class="field"><label>分辨率</label><div class="readonly">1920 × 1080</div></div>
                    <div class="field"><label for="bitrate">VBR 码率</label><input id="bitrate" type="number" min="500" max="100000" step="100" value="8000"></div>
                    <div class="field"><label for="fps">帧率</label><input id="fps" type="number" min="1" max="240" step="1" value="60"></div>
                    <div class="field"><label>编码 / 格式</label><div class="readonly">H.264 / MP4</div></div>
                    <div class="field"><label>色彩空间</label><div class="readonly">Rec.709 SDR</div></div>
                    <div class="field"><label>音频</label><div class="readonly">复制原视频音频</div></div>
                </div>
            </div>
        </div>
        <div class="settings-actions"><button class="button primary" id="renderButton" type="button" disabled>保存并开始压制</button></div>
    </aside>
</main>

<script>
const QUEUE_SORT_KEYS=new Set(['folder_created_desc','folder_created_asc','folder_modified_desc','source_modified_desc','name_asc','name_desc']);
const storedQueueSort=localStorage.getItem('autoslice.subtitle-queue-sort');
const SUBTITLE_ROOT_STORAGE_KEY='autoslice.subtitle-root-dir';
const state={pairs:[],selectedIndex:-1,queueSort:QUEUE_SORT_KEYS.has(storedQueueSort)?storedQueueSort:'folder_created_desc',sourceCues:[],edited:new Map(),suggestions:new Map(),aiApplied:new Set(),protectedEdits:new Set(),deleted:new Set(),mergePrevious:new Map(),mergeOverrides:new Map(),timeOverrides:new Map(),selectedCueIndex:null,correctedPath:'',referenceTitles:null,filter:'all',defaults:null,previewUrl:'',sse:null,sseReconnectTimer:null,taskEvents:new Map(),taskContexts:new Map(),selectionVersion:0,busy:false};
const queueNameCollator=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});

function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
async function jsonRequest(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok||data.error){const error=new Error(data.error||`请求失败 ${response.status}`);error.payload=data;error.status=response.status;throw error;}return data;}
function selectedPair(){return state.selectedIndex>=0?state.pairs[state.selectedIndex]:null;}
function setTask(message,type=''){const el=document.getElementById('taskStatus');el.textContent=message;el.className=`task-status ${type}`.trim();}
function renderReferenceTitles(){const recommended=document.getElementById('recommendedTitle');const candidates=document.getElementById('titleCandidates');const reason=document.getElementById('titleReason');const result=state.referenceTitles;if(!result){recommended.textContent='尚未生成';recommended.className='title-recommended empty';candidates.hidden=true;candidates.innerHTML='';reason.hidden=true;reason.textContent='';updateActionState();return;}recommended.textContent=result.recommended_title||'未生成有效标题';recommended.className='title-recommended';const values=Array.isArray(result.candidates)?result.candidates:[];candidates.innerHTML=values.map((title,index)=>`<div class="title-candidate"><strong>${index+1}</strong><span>${esc(title)}</span></div>`).join('');candidates.hidden=!values.length;reason.textContent=result.reason?`推荐理由：${result.reason}`:'';reason.hidden=!result.reason;updateActionState();}
function updateActionState(){const pair=selectedPair();const subtitleReady=Boolean(pair?.has_source_srt&&!pair.subtitle_error);document.getElementById('transcribeButton').disabled=state.busy||!pair||!pair.needs_transcription;document.getElementById('reflowButton').disabled=state.busy||!pair?.can_reflow_srt;['reviewButton','forceReviewButton','saveButton','previewButton','renderButton','generateTitleButton'].forEach(id=>{document.getElementById(id).disabled=state.busy||!subtitleReady;});document.getElementById('copyTitleButton').disabled=state.busy||!state.referenceTitles?.recommended_title;}
function setBusy(busy){state.busy=Boolean(busy);document.getElementById('scanButton').disabled=state.busy;document.getElementById('rootDir').disabled=state.busy;document.getElementById('queueSort').disabled=state.busy;document.querySelectorAll('.queue-item').forEach(el=>{el.disabled=state.busy;});updateActionState();}

function styleValues(){return{font_name:'Noto Sans S Chinese Black',font_size:Number(document.getElementById('fontSize').value),font_color:document.getElementById('fontColor').value.replace('#',''),outline_color:document.getElementById('outlineColor').value.replace('#',''),outline_width:Number(document.getElementById('outlineWidth').value),x:Number(document.getElementById('positionX').value),y:Number(document.getElementById('positionY').value),shadow:0};}
function exportValues(){return{width:1920,height:1080,bitrate_kbps:Number(document.getElementById('bitrate').value),rate_control:'vbr',codec:'h264',container:'mp4',fps:Number(document.getElementById('fps').value),color_space:'bt709',color_range:'tv',audio:'copy'};}

async function loadDefaults(){try{const data=await jsonRequest('/api/subtitles/defaults');state.defaults=data;const font=data.font||{};const el=document.getElementById('fontStatus');el.textContent=font.available?`${font.requested} → ${font.resolved}`:`字体不可用：${font.resolved||'未解析'}`;el.className=`font-status ${font.available?'ok':''}`;applyDefaults(data);}catch(error){setTask(error.message,'error');}}
function applyDefaults(data){const style=data.style||{},exp=data.export||{};let remembered='';try{remembered=localStorage.getItem(SUBTITLE_ROOT_STORAGE_KEY)||''}catch(error){}document.getElementById('rootDir').value=remembered||data.submission_dir||'submissions';document.getElementById('fontSize').value=style.font_size??20;setColor('fontColor',style.font_color||'ffffff');setColor('outlineColor',style.outline_color||'d06e95');document.getElementById('outlineWidth').value=style.outline_width??100;document.getElementById('positionX').value=style.x??0;document.getElementById('positionY').value=style.y??-788;document.getElementById('bitrate').value=exp.bitrate_kbps??8000;document.getElementById('fps').value=exp.fps??60;}
function setColor(id,value){const clean=String(value).replace('#','').toLowerCase();document.getElementById(id).value=clean;document.getElementById(`${id}Picker`).value=`#${clean}`;}

function compareQueueTime(left,right,key,descending){const a=Number(left[key])||0;const b=Number(right[key])||0;if(a===b)return 0;if(!a)return 1;if(!b)return-1;return descending?b-a:a-b;}
function comparePairs(left,right){let result=0;if(state.queueSort==='folder_created_desc'||state.queueSort==='folder_created_asc'){result=compareQueueTime(left,right,'folder_created_at',state.queueSort.endsWith('_desc'));if(!result)result=compareQueueTime(left,right,'source_created_at',state.queueSort.endsWith('_desc'));}else if(state.queueSort==='folder_modified_desc'){result=compareQueueTime(left,right,'folder_modified_at',true);}else if(state.queueSort==='source_modified_desc'){result=compareQueueTime(left,right,'source_modified_at',true);}else{result=queueNameCollator.compare(`${left.title}\n${left.video_name}`,`${right.title}\n${right.video_name}`);if(state.queueSort==='name_desc')result=-result;}return result||queueNameCollator.compare(left.directory,right.directory);}
function sortPairs(){const selectedId=selectedPair()?.id||null;state.pairs.sort(comparePairs);state.selectedIndex=selectedId?state.pairs.findIndex(pair=>pair.id===selectedId):-1;}
async function scan(){setBusy(true);setTask('扫描投稿目录...');const root=document.getElementById('rootDir').value;try{localStorage.setItem(SUBTITLE_ROOT_STORAGE_KEY,root)}catch(error){}try{const data=await jsonRequest('/api/subtitles/scan',{method:'POST',body:JSON.stringify({root_dir:root})});state.pairs=data.pairs||[];state.selectedIndex=-1;sortPairs();clearEditor();renderQueue();setTask(`找到 ${data.count} 组投稿`,'done');}catch(error){setTask(`扫描失败：${error.message}`,'error');}finally{setBusy(false);}}
function renderQueue(){const queue=document.getElementById('queue');document.getElementById('queueCount').textContent=`${state.pairs.length} 组投稿`;if(!state.pairs.length){queue.innerHTML='<div class="queue-empty">没有找到投稿视频</div>';updateActionState();return;}queue.innerHTML=state.pairs.map((pair,index)=>{const subtitleBadge=pair.needs_transcription?'待识别':pair.subtitle_error?'字幕异常':`${pair.cue_count} 条字幕`;const subtitleState=pair.needs_transcription?'无字幕':pair.has_corrected_srt?'已校对':'原字幕';return `<button type="button" class="queue-item ${index===state.selectedIndex?'active':''}" data-index="${index}" title="${esc(`${pair.title}\n${pair.srt_path||pair.video_path||pair.directory||''}`)}" ${state.busy?'disabled':''}><span class="queue-title">${esc(pair.title)}</span><span class="queue-meta"><span class="badge ${pair.needs_transcription||pair.subtitle_error?'warn':'ok'}">${subtitleBadge}</span><span class="badge ${pair.has_corrected_srt?'ok':''}">${subtitleState}</span><span class="badge ${pair.has_output_video?'ok':''}">${pair.has_output_video?'已压制':'未压制'}</span></span></button>`;}).join('');queue.querySelectorAll('.queue-item').forEach(el=>el.addEventListener('click',()=>selectPair(Number(el.dataset.index))));updateActionState();}
function clearEditor(){state.selectionVersion+=1;state.sourceCues=[];state.edited.clear();state.suggestions.clear();state.aiApplied.clear();state.protectedEdits.clear();state.deleted.clear();state.mergePrevious.clear();state.mergeOverrides.clear();state.timeOverrides.clear();state.selectedCueIndex=null;state.correctedPath='';document.getElementById('editorTitle').textContent='请选择投稿';document.getElementById('editorTitle').removeAttribute('title');document.getElementById('editorPath').textContent='';document.getElementById('editorPath').removeAttribute('title');document.getElementById('cueList').innerHTML='<div class="queue-empty">选择左侧投稿后加载字幕</div>';document.getElementById('artifactPath').textContent='尚未生成校对字幕';setTask('等待选择投稿');updateChangeCount();updateActionState();}

function sameCueTimeline(left,right){return Number(left.index)===Number(right.index)&&left.start===right.start&&left.end===right.end&&String(left.settings||'')===String(right.settings||'');}
function correctedTimelineMatches(source,corrected){if(!corrected.length||corrected.length>source.length)return false;let sourceCursor=0;for(const correctedCue of corrected){let matchedIndex=-1;for(let index=sourceCursor;index<source.length;index+=1){if(sameCueTimeline(source[index],correctedCue)){matchedIndex=index;break;}}if(matchedIndex<0)return false;sourceCursor=matchedIndex+1;}return true;}
async function selectPair(index){if(state.busy)return;const selection=++state.selectionVersion;state.selectedIndex=index;state.suggestions.clear();state.aiApplied.clear();state.protectedEdits.clear();state.deleted.clear();state.correctedPath='';renderQueue();const pair=selectedPair();if(!pair)return;const pairId=pair.id;document.getElementById('editorTitle').textContent=pair.title;document.getElementById('editorTitle').title=pair.title;if(pair.needs_transcription){document.getElementById('editorPath').textContent=pair.video_path;document.getElementById('editorPath').title=pair.video_path;document.getElementById('cueList').innerHTML='<div class="queue-empty">该成片尚无字幕</div>';document.getElementById('artifactPath').textContent=`将生成：${pair.srt_path}`;setTask('等待自动识别字幕');updateChangeCount();updateActionState();return;}document.getElementById('editorPath').textContent=pair.srt_path;document.getElementById('editorPath').title=pair.srt_path;if(pair.subtitle_error){document.getElementById('cueList').innerHTML='<div class="queue-empty">字幕文件无法读取</div>';setTask(pair.subtitle_error,'error');updateActionState();return;}setBusy(true);setTask('加载字幕...');try{const source=await jsonRequest('/api/subtitles/cues',{method:'POST',body:JSON.stringify({srt_path:pair.srt_path})});if(selection!==state.selectionVersion||selectedPair()?.id!==pairId)return;state.sourceCues=source.cues||[];state.edited=new Map(state.sourceCues.map(cue=>[cue.index,cue.text]));if(pair.has_corrected_srt){const corrected=await jsonRequest('/api/subtitles/cues',{method:'POST',body:JSON.stringify({srt_path:pair.corrected_srt_path})});if(selection!==state.selectionVersion||selectedPair()?.id!==pairId)return;const correctedCues=corrected.cues||[];if(!correctedTimelineMatches(state.sourceCues,correctedCues))throw new Error('已有校对字幕与当前源字幕时间轴不一致，请重新保存校对字幕');const keptIndices=new Set(correctedCues.map(cue=>Number(cue.index)));for(const cue of state.sourceCues){if(!keptIndices.has(Number(cue.index)))state.deleted.add(cue.index);}for(const cue of correctedCues){state.edited.set(cue.index,cue.text);if(cue.text!==sourceText(cue.index))state.protectedEdits.add(cue.index);}state.correctedPath=pair.corrected_srt_path;}const maxTime=state.sourceCues.reduce((max,cue)=>Math.max(max,Number(cue.end_seconds)||0),1);const first=state.sourceCues[0];const preview=first?(Number(first.start_seconds)+Number(first.end_seconds))/2:0;document.getElementById('previewRange').max=maxTime.toFixed(1);document.getElementById('previewRange').value=preview.toFixed(1);document.getElementById('previewTime').value=preview.toFixed(1);renderCues();updateArtifact();setTask(`字幕已加载，共 ${state.sourceCues.length} 条`,'done');}catch(error){if(selection===state.selectionVersion)setTask(error.message,'error');}finally{if(selection===state.selectionVersion)setBusy(false);}}

function cueChanged(cue){return (state.edited.get(cue.index)??cue.text)!==cue.text;}
function visibleCue(cue){const deleted=state.deleted.has(cue.index);if(state.filter==='suggested')return !deleted&&state.suggestions.has(cue.index);if(state.filter==='changed')return deleted||cueChanged(cue);return !deleted;}
function resizeCueTextarea(textarea){textarea.style.height='auto';textarea.style.height=`${Math.max(44,textarea.scrollHeight+2)}px`;}
function renderCues(){const list=document.getElementById('cueList');const cues=state.sourceCues.filter(visibleCue);if(!cues.length){list.innerHTML='<div class="queue-empty">当前筛选没有字幕</div>';updateChangeCount();return;}list.innerHTML=cues.map(cue=>{const deleted=state.deleted.has(cue.index);if(deleted)return `<div class="cue-row deleted" data-index="${cue.index}"><span class="cue-spacer" aria-hidden="true"></span><div class="cue-time">${esc(cue.start)}<br>${esc(cue.end)}</div><div class="cue-content"><div class="cue-column"><span class="cue-label">已删除</span><div class="cue-original">${esc(cue.text)}</div></div></div><button class="cue-delete restore" type="button" aria-label="恢复第 ${cue.index} 条字幕">恢复</button></div>`;const suggestion=state.suggestions.get(cue.index);const edited=state.edited.get(cue.index)??cue.text;const changed=edited!==cue.text;return `<div class="cue-row ${changed?'changed':''} ${suggestion?'suggested':''}" data-index="${cue.index}"><input class="cue-check" type="checkbox" ${changed?'checked':''} aria-label="采用第 ${cue.index} 条修改"><div class="cue-time">${esc(cue.start)}<br>${esc(cue.end)}</div><div class="cue-content"><div class="cue-column"><span class="cue-label">识别原文</span><div class="cue-original">${esc(cue.text)}</div></div><div class="cue-column"><span class="cue-label">校对后</span><textarea class="cue-edit" rows="1">${esc(edited)}</textarea>${suggestion?`<div class="cue-reason">${esc(suggestion.reason)}<span class="confidence">${Math.round(Number(suggestion.confidence)*100)}%</span></div>`:''}</div></div><button class="cue-delete" type="button" aria-label="删除第 ${cue.index} 条字幕">删除</button></div>`;}).join('');list.querySelectorAll('.cue-row').forEach(row=>{const index=Number(row.dataset.index);const textarea=row.querySelector('.cue-edit');const checkbox=row.querySelector('.cue-check');if(!textarea||!checkbox)return;resizeCueTextarea(textarea);textarea.addEventListener('input',()=>{resizeCueTextarea(textarea);state.protectedEdits.add(index);state.aiApplied.delete(index);state.edited.set(index,textarea.value);checkbox.checked=textarea.value!==sourceText(index);row.classList.toggle('changed',checkbox.checked);updateChangeCount();});checkbox.addEventListener('change',()=>{state.protectedEdits.add(index);state.aiApplied.delete(index);const suggestion=state.suggestions.get(index);const value=checkbox.checked?(suggestion?.corrected??textarea.value):sourceText(index);state.edited.set(index,value);textarea.value=value;resizeCueTextarea(textarea);row.classList.toggle('changed',value!==sourceText(index));updateChangeCount();});});list.querySelectorAll('.cue-delete').forEach(button=>button.addEventListener('click',()=>{const row=button.closest('.cue-row');const index=Number(row?.dataset.index);if(button.classList.contains('restore'))restoreCue(index);else deleteCue(index);}));updateChangeCount();}
function sourceText(index){return state.sourceCues.find(cue=>cue.index===index)?.text??'';}
function deleteCue(index){if(!state.sourceCues.some(cue=>cue.index===index))return;if(state.deleted.size>=state.sourceCues.length-1){setTask('至少保留一条字幕，无法删除全部字幕','error');return;}state.deleted.add(index);state.edited.delete(index);state.suggestions.delete(index);state.aiApplied.delete(index);state.protectedEdits.delete(index);renderCues();}
function restoreCue(index){if(!state.deleted.has(index))return;state.deleted.delete(index);state.edited.set(index,sourceText(index));state.suggestions.delete(index);state.aiApplied.delete(index);state.protectedEdits.delete(index);renderCues();}
function updateChangeCount(){const correctionCount=corrections().length;const deletionCount=deletions().length;const total=correctionCount+deletionCount;document.getElementById('changeCount').textContent=deletionCount?`${total} 处变更（含 ${deletionCount} 条删除）`:`${total} 条修改`;}
function corrections(){return state.sourceCues.filter(cue=>!state.deleted.has(cue.index)&&cueChanged(cue)).map(cue=>({index:cue.index,original:cue.text,corrected:state.edited.get(cue.index)}));}
function deletions(){return [...state.deleted].sort((left,right)=>left-right);}

function normaliseWindowsPath(value){return String(value||'').replace(/\//g,'\\').toLowerCase();}
function registerTask(taskId,context){if(!taskId)return;state.taskContexts.set(taskId,context);const pending=state.taskEvents.get(taskId);if(pending)handleTask(pending);}
async function startTranscription(){const pair=selectedPair();if(!pair||!pair.needs_transcription)return;const context={kind:'transcribe',pairId:pair.id,videoPath:pair.video_path};setBusy(true);setTask('启动自动字幕识别...');try{const data=await jsonRequest('/api/subtitles/transcribe',{method:'POST',body:JSON.stringify({video_path:pair.video_path})});registerTask(data.task_id,context);}catch(error){if(error.payload?.task_id){registerTask(error.payload.task_id,context);setTask('该视频已有字幕识别任务，正在接入进度...');}else{setBusy(false);setTask(error.message,'error');}}}
async function reflowSubtitles(){const pair=selectedPair();if(!pair||!pair.can_reflow_srt)return;setBusy(true);setTask(pair.is_reflowed_srt?'重新整理字幕...':'整理长字幕...');try{const result=await jsonRequest('/api/subtitles/reflow',{method:'POST',body:JSON.stringify({video_path:pair.video_path,srt_path:pair.raw_srt_path||pair.srt_path})});pair.raw_srt_path=result.source_srt_path;pair.srt_path=result.srt_path;pair.srt_name=String(result.srt_path||'').split(/[\\/]/).pop();pair.corrected_srt_path=result.corrected_srt_path;pair.has_corrected_srt=false;pair.is_reflowed_srt=true;pair.can_reflow_srt=true;pair.cue_count=Number(result.cue_count)||0;renderQueue();setBusy(false);await selectPair(state.selectedIndex);setTask(`已整理为 ${result.cue_count} 条字幕`,'done');}catch(error){setTask(error.message,'error');setBusy(false);}}
async function startReview(force=false){const pair=selectedPair();if(!pair)return;const context={kind:'review',pairId:pair.id,srtPath:pair.srt_path};setBusy(true);setTask(force?'重新调用 AI 检查...':'启动 AI 检查...');try{const data=await jsonRequest('/api/subtitles/review',{method:'POST',body:JSON.stringify({video_path:pair.video_path,srt_path:pair.srt_path,context_title:pair.title,force})});registerTask(data.task_id,context);}catch(error){if(error.payload?.task_id){registerTask(error.payload.task_id,context);setTask('该字幕已有检查任务，正在接入进度...');}else{setBusy(false);setTask(error.message,'error');}}}
function applyReview(result,context){const pair=selectedPair();if(!pair||pair.id!==context.pairId)return false;if(result.source_srt_path&&normaliseWindowsPath(result.source_srt_path)!==normaliseWindowsPath(context.srtPath))throw new Error('AI 校对结果不属于当前字幕，已拒绝应用');for(const index of state.aiApplied){const previous=state.suggestions.get(index);if(!state.protectedEdits.has(index)&&previous&&state.edited.get(index)===previous.corrected)state.edited.set(index,sourceText(index));}state.aiApplied.clear();const validSuggestions=[];for(const item of Array.isArray(result.suggestions)?result.suggestions:[]){const index=Number(item.index);if(state.deleted.has(index)||!Number.isInteger(index)||sourceText(index)!==item.original||typeof item.corrected!=='string'||!item.corrected.trim())continue;validSuggestions.push({...item,index});}state.suggestions=new Map(validSuggestions.map(item=>[item.index,item]));const defaults=new Set((Array.isArray(result.default_corrections)?result.default_corrections:[]).map(item=>Number(item.index)));for(const suggestion of state.suggestions.values()){const index=suggestion.index;if(defaults.has(index)&&!state.protectedEdits.has(index)&&state.edited.get(index)===sourceText(index)){state.edited.set(index,suggestion.corrected);state.aiApplied.add(index);}}renderCues();const cacheNote=result.cache_hit?'（使用有效缓存）':'';setTask(`发现 ${state.suggestions.size} 条校对建议${cacheNote}`,'done');setBusy(false);return true;}

async function saveCorrections(){const pair=selectedPair();if(!pair)throw new Error('请先选择投稿');const confirmed=corrections();const removed=deletions();const data=await jsonRequest('/api/subtitles/save',{method:'POST',body:JSON.stringify({srt_path:pair.srt_path,corrections:confirmed,deleted_indices:removed})});for(const item of confirmed){state.protectedEdits.add(Number(item.index));state.aiApplied.delete(Number(item.index));}state.correctedPath=data.corrected_srt_path;pair.corrected_srt_path=data.corrected_srt_path;pair.has_corrected_srt=true;renderQueue();updateArtifact();return data.corrected_srt_path;}
async function saveClick(){setBusy(true);setTask('保存校对字幕...');try{const correctionCount=corrections().length;const deletionCount=deletions().length;await saveCorrections();setTask(deletionCount?`已保存 ${correctionCount} 条修改、删除 ${deletionCount} 条字幕`:`已保存 ${correctionCount} 条修改`,'done');}catch(error){setTask(error.message,'error');}finally{setBusy(false);}}
function updateArtifact(){document.getElementById('artifactPath').textContent=state.correctedPath||'尚未生成校对字幕';}

async function preview(){const pair=selectedPair();if(!pair)return;setBusy(true);setTask('生成字幕预览...');try{const srtPath=await saveCorrections();const response=await fetch('/api/subtitles/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_path:pair.video_path,srt_path:srtPath,style:styleValues(),export:exportValues(),preview_time:Number(document.getElementById('previewTime').value)})});if(!response.ok){const data=await response.json();throw new Error(data.error||'预览失败');}const blob=await response.blob();if(state.previewUrl)URL.revokeObjectURL(state.previewUrl);state.previewUrl=URL.createObjectURL(blob);const image=document.getElementById('previewImage');image.src=state.previewUrl;image.style.display='block';document.getElementById('previewPlaceholder').style.display='none';setTask('预览已更新','done');}catch(error){setTask(error.message,'error');}finally{setBusy(false);}}

async function renderVideo(){const pair=selectedPair();if(!pair)return;const context={kind:'render',pairId:pair.id,srtPath:pair.srt_path};setBusy(true);setTask('保存字幕并启动压制...');try{const srtPath=await saveCorrections();const data=await jsonRequest('/api/subtitles/render',{method:'POST',body:JSON.stringify({video_path:pair.video_path,srt_path:srtPath,style:styleValues(),export:exportValues()})});registerTask(data.task_id,context);}catch(error){setBusy(false);setTask(error.message,'error');}}

function rememberTaskEvent(data){state.taskEvents.set(data.task_id,data);while(state.taskEvents.size>100)state.taskEvents.delete(state.taskEvents.keys().next().value);}
function finishTask(taskId){state.taskContexts.delete(taskId);state.taskEvents.delete(taskId);setBusy(false);}
function connectSSE(){if(state.sseReconnectTimer){clearTimeout(state.sseReconnectTimer);state.sseReconnectTimer=null;}if(state.sse)state.sse.close();state.sse=new EventSource('/api/events');const handle=payload=>{for(const [taskId,data] of Object.entries(payload||{})){if(!taskId.startsWith('subtitle_'))continue;handleTask({task_id:taskId,...data});}};state.sse.addEventListener('init',event=>handle(JSON.parse(event.data)));state.sse.addEventListener('task_update',event=>handleTask(JSON.parse(event.data)));state.sse.onerror=()=>{if(state.sse){state.sse.close();state.sse=null;}if(!state.sseReconnectTimer)state.sseReconnectTimer=setTimeout(connectSSE,3000);};}
function handleTask(data){if(!data.task_id?.startsWith('subtitle_'))return;rememberTaskEvent(data);const context=state.taskContexts.get(data.task_id);if(!context)return;const pair=selectedPair();if(!pair||pair.id!==context.pairId)return;setTask(data.progress||data.status,data.status==='error'?'error':data.status==='done'?'done':'');if(data.status==='done'){try{const result=data.result?JSON.parse(data.result):{};if(context.kind==='transcribe'){if(normaliseWindowsPath(result.video_path)!==normaliseWindowsPath(context.videoPath))throw new Error('字幕识别结果不属于当前视频，已拒绝应用');pair.srt_path=result.srt_path;pair.srt_name=String(result.srt_path||'').split(/[\\/]/).pop();pair.has_source_srt=true;pair.needs_transcription=false;pair.subtitle_error='';pair.cue_count=Number(result.cue_count)||0;renderQueue();finishTask(data.task_id);selectPair(state.selectedIndex);return;}if(context.kind==='review')applyReview(result,context);if(context.kind==='title'){if(normaliseWindowsPath(result.source_srt_path)!==normaliseWindowsPath(context.srtPath))throw new Error('参考标题不属于当前字幕，已拒绝显示');state.referenceTitles=result;renderReferenceTitles();setTask('参考标题生成完成','done');}if(context.kind==='render'){pair.has_output_video=true;renderQueue();setTask(`压制完成：${result.output_video_path}`,'done');}finishTask(data.task_id);}catch(error){setTask(error.message,'error');finishTask(data.task_id);}}else if(data.status==='error'){setTask(data.progress||'任务失败','error');finishTask(data.task_id);}}

// 合并关系以“后一条 -> 前一条”保存，输出时才能准确延长时间轴而非伪装成删除。
function mergeRoot(index){let current=Number(index);const visited=new Set();while(state.mergePrevious.has(current)&&!visited.has(current)){visited.add(current);current=Number(state.mergePrevious.get(current));}return current;}
function mergeChildOf(index){const parent=Number(index);for(const [child,previous] of state.mergePrevious){if(Number(previous)===parent)return Number(child);}return null;}
function mergeMembers(index){const root=mergeRoot(index);const first=state.sourceCues.find(cue=>Number(cue.index)===root);if(!first)return[];const members=[first];const visited=new Set([root]);let current=root;while(true){const child=mergeChildOf(current);if(child===null||visited.has(child))break;const cue=state.sourceCues.find(item=>Number(item.index)===child);if(!cue)break;members.push(cue);visited.add(child);current=child;}return members;}
function isMergedChild(index){return state.mergePrevious.has(Number(index));}
function joinSubtitleText(left,right){const leftText=String(left||'').trim();const rightText=String(right||'').trim();if(!leftText)return rightText;if(!rightText)return leftText;if(/\s$/.test(String(left||''))||/^\s/.test(String(right||'')))return `${leftText} ${rightText}`;return leftText+rightText;}
function mergedDefaultText(index){return mergeMembers(index).reduce((text,cue)=>joinSubtitleText(text,state.edited.get(cue.index)??cue.text),'');}
function mergedDisplayText(index){const root=mergeRoot(index);return state.mergeOverrides.get(root)??mergedDefaultText(root);}
function mergeEndCue(index){const members=mergeMembers(index);return members[members.length-1]||null;}
function parseSrtTime(value){const match=String(value||'').trim().match(/^(?:(\d{1,3}):)?(\d{1,2}):(\d{2})(?:[,.](\d{1,3}))?$/);if(!match)return null;const hours=Number(match[1]||0),minutes=Number(match[2]),seconds=Number(match[3]),milliseconds=Number(String(match[4]||'0').padEnd(3,'0'));if(minutes>59||seconds>59||milliseconds>999)return null;return hours*3600+minutes*60+seconds+milliseconds/1000;}
function formatSrtTime(seconds){const total=Math.max(0,Math.round((Number(seconds)||0)*1000));const hours=Math.floor(total/3600000);const minutes=Math.floor(total%3600000/60000);const secs=Math.floor(total%60000/1000);const ms=total%1000;return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')},${String(ms).padStart(3,'0')}`;}
function defaultGroupTiming(index){const members=mergeMembers(index);const first=members[0];const last=members[members.length-1];return{start:Number(first?.start_seconds)||0,end:Number(last?.end_seconds)||0};}
function groupTiming(index){const root=mergeRoot(index);return state.timeOverrides.get(root)||defaultGroupTiming(root);}
function timeOverrides(){const result={};for(const [index,timing] of state.timeOverrides){const defaults=defaultGroupTiming(index);if(Math.abs(Number(timing.start)-defaults.start)>0.0005||Math.abs(Number(timing.end)-defaults.end)>0.0005)result[String(index)]={start:Number(timing.start),end:Number(timing.end)};}return result;}
function timingChanged(index){return Object.prototype.hasOwnProperty.call(timeOverrides(),String(mergeRoot(index)));}
function mergeCount(){return state.sourceCues.length?state.mergePrevious.size:0;}
function mergePairs(){return [...state.mergePrevious.entries()].sort((left,right)=>Number(left[0])-Number(right[0])).map(([second,first])=>({first:Number(first),second:Number(second)}));}
function mergeOverrides(){const result={};for(const [index,text] of state.mergeOverrides){const defaultText=mergedDefaultText(index);if(String(text).trim()&&String(text)!==defaultText)result[String(index)]=String(text);}return result;}
function cuePosition(index){return state.sourceCues.findIndex(cue=>Number(cue.index)===Number(index));}
function unmergeGroup(index){const root=mergeRoot(index);const members=mergeMembers(root);if(members.length<2)return false;const timing=state.timeOverrides.get(root);state.mergeOverrides.delete(root);state.timeOverrides.delete(root);for(const cue of members.slice(1))state.mergePrevious.delete(Number(cue.index));if(timing){const first=members[0],last=members[members.length-1];if(Math.abs(Number(timing.start)-Number(first.start_seconds))>0.0005)state.timeOverrides.set(Number(first.index),{start:Number(timing.start),end:Number(first.end_seconds)});if(Math.abs(Number(timing.end)-Number(last.end_seconds))>0.0005)state.timeOverrides.set(Number(last.index),{start:Number(last.start_seconds),end:Number(timing.end)});}return true;}
function mergeGroups(leftIndex,rightIndex){const leftRoot=mergeRoot(leftIndex);const rightRoot=mergeRoot(rightIndex);if(leftRoot===rightRoot)return false;const leftMembers=mergeMembers(leftRoot);const rightMembers=mergeMembers(rightRoot);const leftTail=leftMembers[leftMembers.length-1];const rightFirst=rightMembers[0];if(!leftTail||!rightFirst||cuePosition(rightFirst.index)!==cuePosition(leftTail.index)+1)return false;if(state.deleted.has(leftTail.index)||state.deleted.has(rightFirst.index))return false;const mustPreserveText=state.mergeOverrides.has(leftRoot)||state.mergeOverrides.has(rightRoot);const mustPreserveTiming=state.timeOverrides.has(leftRoot)||state.timeOverrides.has(rightRoot);const combinedText=joinSubtitleText(mergedDisplayText(leftRoot),mergedDisplayText(rightRoot));const combinedTiming={start:groupTiming(leftRoot).start,end:groupTiming(rightRoot).end};state.mergePrevious.set(Number(rightFirst.index),Number(leftTail.index));state.mergeOverrides.delete(rightRoot);state.timeOverrides.delete(rightRoot);if(mustPreserveText)state.mergeOverrides.set(leftRoot,combinedText);if(mustPreserveTiming)state.timeOverrides.set(leftRoot,combinedTiming);return true;}
function mergeWithPrevious(index){const root=mergeRoot(index);const position=cuePosition(root);if(position<=0){setTask('当前已是第一条字幕，无法向上合并','error');return;}const previous=state.sourceCues[position-1];if(state.deleted.has(previous.index)){setTask('上一条字幕已删除，无法合并','error');return;}if(mergeGroups(previous.index,root))renderCues();}
function mergeWithNext(index){const root=mergeRoot(index);const tail=mergeEndCue(root);const position=tail?cuePosition(tail.index):-1;if(position<0||position>=state.sourceCues.length-1){setTask('当前已是最后一条字幕，无法向下合并','error');return;}const next=state.sourceCues[position+1];if(state.deleted.has(next.index)){setTask('下一条字幕已删除，无法合并','error');return;}if(mergeGroups(root,next.index))renderCues();}
function restoreCorrectedState(sourceCues,correctedCues){if(!Array.isArray(correctedCues)||!correctedCues.length||correctedCues.length>sourceCues.length)return false;let sourceCursor=0;for(const correctedCue of correctedCues){let startPosition=-1;for(let position=sourceCursor;position<sourceCues.length;position+=1){const sourceCue=sourceCues[position];if(Number(sourceCue.index)===Number(correctedCue.index)&&sourceCue.start===correctedCue.start&&String(sourceCue.settings||'')===String(correctedCue.settings||'')){startPosition=position;break;}}if(startPosition<0)return false;for(let position=sourceCursor;position<startPosition;position+=1)state.deleted.add(Number(sourceCues[position].index));let endPosition=startPosition;while(endPosition<sourceCues.length&&sourceCues[endPosition].end!==correctedCue.end)endPosition+=1;if(endPosition>=sourceCues.length)return false;const members=sourceCues.slice(startPosition,endPosition+1);const root=Number(members[0].index);if(members.length>1){for(let position=1;position<members.length;position+=1)state.mergePrevious.set(Number(members[position].index),Number(members[position-1].index));state.mergeOverrides.set(root,correctedCue.text);state.protectedEdits.add(root);}else{state.edited.set(root,correctedCue.text);if(correctedCue.text!==sourceText(root))state.protectedEdits.add(root);}sourceCursor=endPosition+1;}for(let position=sourceCursor;position<sourceCues.length;position+=1)state.deleted.add(Number(sourceCues[position].index));return true;}
function applySavedEditState(saved){if(!saved||typeof saved!=='object')return false;for(const item of saved.corrections||[]){const index=Number(item.index);if(!Number.isInteger(index)||sourceText(index)!==item.original)return false;state.edited.set(index,item.corrected);state.protectedEdits.add(index);}for(const index of saved.deleted_indices||[])state.deleted.add(Number(index));for(const pair of saved.merge_pairs||[])state.mergePrevious.set(Number(pair.second),Number(pair.first));for(const [index,text] of Object.entries(saved.merge_overrides||{}))state.mergeOverrides.set(Number(index),String(text));for(const [index,timing] of Object.entries(saved.time_overrides||{}))state.timeOverrides.set(Number(index),{start:Number(timing.start),end:Number(timing.end)});return true;}

async function selectPair(index){if(state.busy)return;const selection=++state.selectionVersion;state.selectedIndex=index;state.suggestions.clear();state.aiApplied.clear();state.protectedEdits.clear();state.deleted.clear();state.mergePrevious.clear();state.mergeOverrides.clear();state.timeOverrides.clear();state.selectedCueIndex=null;state.correctedPath='';renderQueue();const pair=selectedPair();if(!pair)return;const pairId=pair.id;document.getElementById('editorTitle').textContent=pair.title;document.getElementById('editorTitle').title=pair.title;if(pair.needs_transcription){document.getElementById('editorPath').textContent=pair.video_path;document.getElementById('editorPath').title=pair.video_path;document.getElementById('cueList').innerHTML='<div class="queue-empty">该成片尚无字幕</div>';document.getElementById('artifactPath').textContent=`将生成：${pair.srt_path}`;setTask('等待自动识别字幕');updateChangeCount();updateActionState();return;}document.getElementById('editorPath').textContent=pair.srt_path;document.getElementById('editorPath').title=pair.srt_path;if(pair.subtitle_error){document.getElementById('cueList').innerHTML='<div class="queue-empty">字幕文件无法读取</div>';setTask(pair.subtitle_error,'error');updateActionState();return;}setBusy(true);setTask('加载字幕...');try{const source=await jsonRequest('/api/subtitles/cues',{method:'POST',body:JSON.stringify({srt_path:pair.srt_path})});if(selection!==state.selectionVersion||selectedPair()?.id!==pairId)return;state.sourceCues=source.cues||[];state.edited=new Map(state.sourceCues.map(cue=>[cue.index,cue.text]));if(pair.has_corrected_srt){const savedResponse=await jsonRequest('/api/subtitles/edit-state',{method:'POST',body:JSON.stringify({srt_path:pair.srt_path})});if(selection!==state.selectionVersion||selectedPair()?.id!==pairId)return;if(savedResponse.available){if(!applySavedEditState(savedResponse.edit_state))throw new Error('已有字幕校对状态无效，请重新保存校对字幕');}else{const corrected=await jsonRequest('/api/subtitles/cues',{method:'POST',body:JSON.stringify({srt_path:pair.corrected_srt_path})});if(selection!==state.selectionVersion||selectedPair()?.id!==pairId)return;if(!restoreCorrectedState(state.sourceCues,corrected.cues||[]))throw new Error('已有校对字幕与当前源字幕时间轴不一致，请重新保存校对字幕');}state.correctedPath=pair.corrected_srt_path;}const maxTime=state.sourceCues.reduce((max,cue)=>Math.max(max,Number(cue.end_seconds)||0),1);const first=state.sourceCues[0];const preview=first?(Number(first.start_seconds)+Number(first.end_seconds))/2:0;document.getElementById('previewRange').max=maxTime.toFixed(1);document.getElementById('previewRange').value=preview.toFixed(1);document.getElementById('previewTime').value=preview.toFixed(1);renderCues();updateArtifact();setTask(`字幕已加载，共 ${state.sourceCues.length} 条`,'done');}catch(error){if(selection===state.selectionVersion)setTask(error.message,'error');}finally{if(selection===state.selectionVersion)setBusy(false);}}

const clearEditorWithoutTitleReset=clearEditor;
clearEditor=function(){state.referenceTitles=null;renderReferenceTitles();return clearEditorWithoutTitleReset();};
const selectPairWithoutTitleReset=selectPair;
selectPair=async function(index){state.referenceTitles=null;renderReferenceTitles();return selectPairWithoutTitleReset(index);};

async function generateReferenceTitle(){const pair=selectedPair();if(!pair)return;setBusy(true);state.referenceTitles=null;renderReferenceTitles();setTask('保存当前校对字幕并准备标题材料...');try{const srtPath=await saveCorrections();const context={kind:'title',pairId:pair.id,srtPath};const data=await jsonRequest('/api/subtitles/generate-title',{method:'POST',body:JSON.stringify({video_path:pair.video_path,srt_path:srtPath,context_title:pair.title})});registerTask(data.task_id,context);document.getElementById('generateTitleButton').textContent='重新生成标题';}catch(error){if(error.payload?.task_id){registerTask(error.payload.task_id,{kind:'title',pairId:pair.id,srtPath:state.correctedPath||pair.corrected_srt_path});setTask('该字幕已有标题任务，正在接入进度...');}else{setBusy(false);setTask(error.message,'error');}}}
async function copyRecommendedTitle(){const title=state.referenceTitles?.recommended_title;if(!title)return;try{await navigator.clipboard.writeText(title);setTask('推荐标题已复制','done');}catch(error){setTask('浏览器无法复制，请手动选中标题','error');}}

function cueChanged(cue){const root=mergeRoot(cue.index);if(root!==Number(cue.index))return false;if(mergeMembers(root).length>1||timingChanged(root))return true;return(state.edited.get(cue.index)??cue.text)!==cue.text;}
function visibleCue(cue){const root=mergeRoot(cue.index);if(root!==Number(cue.index))return false;const deleted=state.deleted.has(cue.index);if(state.filter==='suggested')return !deleted&&state.suggestions.has(cue.index);if(state.filter==='changed')return deleted||cueChanged(cue);return !deleted;}
function cueActionMarkup(label, action, extraClass=''){
    const titles={'merge-previous':'与上一条字幕合并','merge-next':'与下一条字幕合并','unmerge':'拆开当前合并字幕'};
    const title=titles[action]||label;
    return `<button class="cue-action ${extraClass}" type="button" data-action="${action}" title="${title}" aria-label="${title}">${label}</button>`;
}
function renderCueActions(cue, members, merged){
    if(state.deleted.has(cue.index)){
        return '<div class="cue-actions"><button class="cue-delete restore" type="button">恢复</button></div>';
    }
    const rootPosition=cuePosition(cue.index);
    const endCue=members[members.length-1]||cue;
    const endPosition=cuePosition(endCue.index);
    const canMergePrevious=rootPosition>0&&!state.deleted.has(state.sourceCues[rootPosition-1].index);
    const canMergeNext=endPosition>=0&&endPosition<state.sourceCues.length-1&&!state.deleted.has(state.sourceCues[endPosition+1].index);
    const actions=[];
    if(canMergePrevious)actions.push(cueActionMarkup('合上','merge-previous'));
    if(canMergeNext)actions.push(cueActionMarkup('合下','merge-next'));
    if(merged)actions.push(cueActionMarkup('拆开','unmerge','unmerge'));
    actions.push('<button class="cue-delete" type="button" data-action="delete">删除</button>');
    return `<div class="cue-actions">${actions.join('')}</div>`;
}
function renderCueDetail(cue,members,merged){if(Number(state.selectedCueIndex)!==Number(cue.index))return'';if(state.deleted.has(cue.index))return `<div class="cue-detail"><div class="cue-time-editor"><span class="cue-label">该字幕已删除，恢复后可继续调整</span></div>${renderCueActions(cue,members,false)}</div>`;const timing=groupTiming(cue.index);return `<div class="cue-detail"><div class="cue-time-editor"><label class="cue-time-field">开始时间<input class="cue-time-input" data-time-start type="text" value="${formatSrtTime(timing.start)}" inputmode="decimal" spellcheck="false"></label><label class="cue-time-field">结束时间<input class="cue-time-input" data-time-end type="text" value="${formatSrtTime(timing.end)}" inputmode="decimal" spellcheck="false"></label><button class="cue-action" data-action="reset-time" type="button">恢复原时间</button><div class="cue-time-error" hidden></div></div>${renderCueActions(cue,members,merged)}</div>`;}
function renderCueRow(cue){
    const members=mergeMembers(cue.index);
    const merged=members.length>1;
    const deleted=state.deleted.has(cue.index);
    const endCue=members[members.length-1]||cue;
    const selected=Number(state.selectedCueIndex)===Number(cue.index);
    if(deleted){
        return `<div class="cue-row deleted ${selected?'selected':''}" data-index="${cue.index}"><span class="cue-spacer" aria-hidden="true"></span><div class="cue-time">${esc(cue.start)}<br>${esc(cue.end)}</div><div class="cue-content"><div class="cue-column"><span class="cue-label">已删除</span><div class="cue-original">${esc(cue.text)}</div></div></div>${renderCueDetail(cue,members,false)}</div>`;
    }
    const suggestion=merged?null:state.suggestions.get(cue.index);
    const originalText=members.reduce((text,item)=>joinSubtitleText(text,item.text),'');
    const edited=mergedDisplayText(cue.index);
    const changed=cueChanged(cue);
    const checkbox=merged
        ? '<span class="cue-spacer" aria-hidden="true"></span>'
        : `<input class="cue-check" type="checkbox" ${changed?'checked':''} aria-label="采用第 ${cue.index} 条修改">`;
    const originalLabel=merged?`合并原文（${members.length} 条）`:'识别原文';
    const suggestionMarkup=suggestion
        ? `<div class="cue-reason">${esc(suggestion.reason)}<span class="confidence">${Math.round(Number(suggestion.confidence)*100)}%</span></div>`
        : '';
    const timing=groupTiming(cue.index);
    return `<div class="cue-row ${selected?'selected':''} ${changed?'changed':''} ${suggestion?'suggested':''}" data-index="${cue.index}">${checkbox}<div class="cue-time">${formatSrtTime(timing.start)}<br>${formatSrtTime(timing.end)}</div><div class="cue-content"><div class="cue-column"><span class="cue-label">${originalLabel}</span><div class="cue-original">${esc(originalText)}</div></div><div class="cue-column"><span class="cue-label">校对后</span><textarea class="cue-edit" rows="1">${esc(edited)}</textarea>${suggestionMarkup}</div></div>${renderCueDetail(cue,members,merged)}</div>`;
}
function wireCueRow(row){
    const index=Number(row.dataset.index);
    const textarea=row.querySelector('.cue-edit');
    const checkbox=row.querySelector('.cue-check');
    row.addEventListener('click',event=>{if(event.target.closest('.cue-detail')||event.target.closest('button')||event.target.closest('.cue-check'))return;if(Number(state.selectedCueIndex)===index)return;const shouldFocus=event.target.closest('.cue-edit')?'.cue-edit':null;state.selectedCueIndex=index;renderCues();if(shouldFocus)setTimeout(()=>document.querySelector(`.cue-row[data-index="${index}"] ${shouldFocus}`)?.focus(),0);});
    if(textarea){
        resizeCueTextarea(textarea);
        textarea.addEventListener('input',()=>{
            resizeCueTextarea(textarea);
            const root=mergeRoot(index);
            if(mergeMembers(root).length>1){
                const defaultText=mergedDefaultText(root);
                if(textarea.value===defaultText)state.mergeOverrides.delete(root);
                else state.mergeOverrides.set(root,textarea.value);
                state.protectedEdits.add(root);
                state.aiApplied.delete(root);
            }else{
                state.protectedEdits.add(index);
                state.aiApplied.delete(index);
                state.edited.set(index,textarea.value);
                if(checkbox)checkbox.checked=textarea.value!==sourceText(index);
                row.classList.toggle('changed',textarea.value!==sourceText(index));
            }
            updateChangeCount();
        });
    }
    if(checkbox)checkbox.addEventListener('change',()=>{
        state.protectedEdits.add(index);
        state.aiApplied.delete(index);
        const suggestion=state.suggestions.get(index);
        const value=checkbox.checked?(suggestion?.corrected??textarea.value):sourceText(index);
        state.edited.set(index,value);
        textarea.value=value;
        resizeCueTextarea(textarea);
        row.classList.toggle('changed',value!==sourceText(index));
        updateChangeCount();
    });
    row.querySelectorAll('.cue-actions button').forEach(button=>button.addEventListener('click',()=>{
        if(button.classList.contains('restore')){restoreCue(index);return;}
        if(button.dataset.action==='merge-previous')mergeWithPrevious(index);
        else if(button.dataset.action==='merge-next')mergeWithNext(index);
        else if(button.dataset.action==='unmerge'){unmergeGroup(index);renderCues();}
        else if(button.dataset.action==='delete')deleteCue(index);
    }));
    const startInput=row.querySelector('[data-time-start]');
    const endInput=row.querySelector('[data-time-end]');
    const timeError=row.querySelector('.cue-time-error');
    const commitTiming=()=>{if(!startInput||!endInput)return;const start=parseSrtTime(startInput.value),end=parseSrtTime(endInput.value);let message='';if(start===null||end===null)message='请输入 HH:MM:SS,mmm 格式的有效时间';else if(end<=start)message='结束时间必须晚于开始时间';if(message){timeError.textContent=message;timeError.hidden=false;startInput.setAttribute('aria-invalid','true');endInput.setAttribute('aria-invalid','true');return;}const defaults=defaultGroupTiming(index);if(Math.abs(start-defaults.start)<=0.0005&&Math.abs(end-defaults.end)<=0.0005)state.timeOverrides.delete(index);else state.timeOverrides.set(index,{start,end});startInput.setAttribute('aria-invalid','false');endInput.setAttribute('aria-invalid','false');renderCues();};
    startInput?.addEventListener('change',commitTiming);
    endInput?.addEventListener('change',commitTiming);
    row.querySelector('[data-action="reset-time"]')?.addEventListener('click',()=>{state.timeOverrides.delete(index);renderCues();});
}
function renderCues(){
    const list=document.getElementById('cueList');
    const cues=state.sourceCues.filter(visibleCue);
    if(!cues.length){
        list.innerHTML='<div class="queue-empty">当前筛选没有字幕</div>';
        updateChangeCount();
        return;
    }
    list.innerHTML=cues.map(renderCueRow).join('');
    list.querySelectorAll('.cue-row').forEach(wireCueRow);
    updateChangeCount();
}
function deleteCue(index){const members=mergeMembers(index);const deletedCount=members.length||1;if(state.deleted.size+deletedCount>=state.sourceCues.length){setTask('至少保留一条字幕，无法删除全部字幕','error');return;}unmergeGroup(index);for(const cue of members){state.deleted.add(Number(cue.index));state.edited.delete(cue.index);state.suggestions.delete(cue.index);state.aiApplied.delete(cue.index);state.protectedEdits.delete(cue.index);state.timeOverrides.delete(Number(cue.index));}state.selectedCueIndex=Number(index);renderCues();}
function restoreCue(index){if(!state.deleted.has(index))return;state.deleted.delete(index);state.edited.set(index,sourceText(index));state.suggestions.delete(index);state.aiApplied.delete(index);state.protectedEdits.delete(index);state.timeOverrides.delete(index);state.selectedCueIndex=Number(index);renderCues();}
function corrections(){return state.sourceCues.filter(cue=>!state.deleted.has(cue.index)&&(state.edited.get(cue.index)??cue.text)!==cue.text).map(cue=>({index:cue.index,original:cue.text,corrected:state.edited.get(cue.index)}));}
function deletions(){return [...state.deleted].sort((left,right)=>left-right);}
function updateChangeCount(){const correctionCount=corrections().length;const deletionCount=deletions().length;const mergedCount=mergeCount();const timingCount=Object.keys(timeOverrides()).length;const total=correctionCount+deletionCount+mergedCount+timingCount;const details=[];if(deletionCount)details.push(`${deletionCount} 条删除`);if(mergedCount)details.push(`${mergedCount} 处合并`);if(timingCount)details.push(`${timingCount} 条时间调整`);document.getElementById('changeCount').textContent=details.length?`${total} 处变更（${details.join('、')}）`:`${total} 条修改`;}
async function saveCorrections(){const pair=selectedPair();if(!pair)throw new Error('请先选择投稿');const confirmed=corrections();const removed=deletions();const pairs=mergePairs();const overrides=mergeOverrides();const timings=timeOverrides();const data=await jsonRequest('/api/subtitles/save',{method:'POST',body:JSON.stringify({srt_path:pair.srt_path,corrections:confirmed,deleted_indices:removed,merge_pairs:pairs,merge_overrides:overrides,time_overrides:timings})});for(const item of confirmed){state.protectedEdits.add(Number(item.index));state.aiApplied.delete(Number(item.index));}state.correctedPath=data.corrected_srt_path;pair.corrected_srt_path=data.corrected_srt_path;pair.has_corrected_srt=true;renderQueue();updateArtifact();return data.corrected_srt_path;}
async function saveClick(){setBusy(true);setTask('保存校对字幕...');try{const correctionCount=corrections().length;const deletionCount=deletions().length;const mergedCount=mergeCount();const timingCount=Object.keys(timeOverrides()).length;await saveCorrections();const details=[`${correctionCount} 条修改`];if(deletionCount)details.push(`删除 ${deletionCount} 条字幕`);if(mergedCount)details.push(`合并 ${mergedCount} 处`);if(timingCount)details.push(`调整 ${timingCount} 条时间`);setTask(`已保存 ${details.join('、')}`,'done');}catch(error){setTask(error.message,'error');}finally{setBusy(false);}}

document.getElementById('scanButton').addEventListener('click',scan);
document.getElementById('queueSort').value=state.queueSort;
document.getElementById('queueSort').addEventListener('change',event=>{state.queueSort=QUEUE_SORT_KEYS.has(event.target.value)?event.target.value:'folder_created_desc';localStorage.setItem('autoslice.subtitle-queue-sort',state.queueSort);sortPairs();renderQueue();});
document.getElementById('transcribeButton').addEventListener('click',startTranscription);
document.getElementById('reflowButton').addEventListener('click',reflowSubtitles);
document.getElementById('reviewButton').addEventListener('click',()=>startReview(false));
document.getElementById('forceReviewButton').addEventListener('click',()=>startReview(true));
document.getElementById('generateTitleButton').addEventListener('click',generateReferenceTitle);
document.getElementById('copyTitleButton').addEventListener('click',copyRecommendedTitle);
document.getElementById('saveButton').addEventListener('click',saveClick);
document.getElementById('previewButton').addEventListener('click',preview);
document.getElementById('renderButton').addEventListener('click',renderVideo);
document.querySelectorAll('[data-settings-tab]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.settingsTab;document.querySelectorAll('[data-settings-tab]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active));});document.querySelectorAll('[data-settings-view]').forEach(view=>{view.hidden=view.dataset.settingsView!==tab;});}));
document.getElementById('cueFilters').querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;document.querySelectorAll('#cueFilters button').forEach(item=>item.classList.toggle('active',item===button));renderCues();}));
document.getElementById('previewRange').addEventListener('input',event=>document.getElementById('previewTime').value=event.target.value);
document.getElementById('previewTime').addEventListener('input',event=>document.getElementById('previewRange').value=event.target.value);
[['fontColor','fontColorPicker'],['outlineColor','outlineColorPicker']].forEach(([textId,pickerId])=>{document.getElementById(textId).addEventListener('input',event=>{if(/^[0-9a-fA-F]{6}$/.test(event.target.value))document.getElementById(pickerId).value=`#${event.target.value}`;});document.getElementById(pickerId).addEventListener('input',event=>document.getElementById(textId).value=event.target.value.slice(1));});

async function boot(){await loadDefaults();connectSSE();await scan();}
boot();
